# Local Nakama server for development.
#
# Run with:  docker compose up -d
# Nakama API on :7350, admin console on http://127.0.0.1:7351 (admin/password)
#
# NOTE: the previous pin, cockroachdb/cockroach:v19.2.5, no longer exists on
# Docker Hub and predates arm64 images, so this file could not start at all on
# an Apple Silicon Mac. v23.1 also requires `start-single-node` -- plain `start`
# without --join is an error in modern CockroachDB.
services:
  cockroachdb:
    image: cockroachdb/cockroach:v23.1.20
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: always
    volumes:
      - data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10
  nakama:
    image: heroiclabs/nakama:3.20.1
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
          exec /nakama/nakama --name nakama1 --database.address root@cockroachdb:26257
            --logger.level DEBUG --session.token_expiry_sec 7200
    restart: always
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - ./nakama/data:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data: {}
